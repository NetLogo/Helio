name: Build and Push Modeling Commons Images

on:
  push:
    branches: [main, app/modeling-commons]
    paths:
      - 'apps/modeling-commons-backend/**'
      - 'apps/modeling-commons-frontend/**'
      - 'packages/modeling-commons-shared/**'
      - 'packages/typescript-config/**'
      - 'packages/tailwind-config/**'
      - 'packages/nuxt-core/**'
      - 'packages/vue-ui/**'
      - 'packages/markdown/**'
      - 'packages/eslint-config/**'
      - 'packages/utils/**'
      - 'packages/common-data/**'
      - 'packages/template/**'
      - 'packages/nuxt-content-assets/**'
      - 'packages/netlogo-docs/**'
      - 'packages/emails/**'
      - 'yarn.lock'
      - '.github/workflows/build-and-push-modeling-commons.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: netlogo1
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install dependencies
        run: yarn run init
        env:
          HELIO_SKIP_CHECKS: '1'
          NUXT_TELEMETRY_DISABLED: '1'

      - name: Build backend
        run: yarn workspace modeling-commons-backend fastify:build
        env:
          HELIO_HEADLESS: 1

      - name: Build frontend
        working-directory: apps/modeling-commons-frontend
        run: yarn nuxt:build
        env:
          HELIO_HEADLESS: 1
          NUXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: --max-old-space-size=4096

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize repo slug
        uses: actions/github-script@v8
        id: repo_slug
        with:
          result-encoding: string
          script: return 'ghcr.io/${{ github.repository }}'.toLowerCase()

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/modeling-commons-backend/dist
          file: ./apps/modeling-commons-backend/Dockerfile
          push: true
          tags: |
            ${{ steps.repo_slug.outputs.result }}/modeling-commons-backend:${{ github.sha }}
            ${{ steps.repo_slug.outputs.result }}/modeling-commons-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/modeling-commons-frontend
          file: ./apps/modeling-commons-frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.repo_slug.outputs.result }}/modeling-commons-frontend:${{ github.sha }}
            ${{ steps.repo_slug.outputs.result }}/modeling-commons-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  restart-deployments:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Restart deployments
        run: |
          APISERVER=https://kubernetes.default.svc
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PATCH='{"spec":{"template":{"metadata":{"annotations":{"kubectl.kubernetes.io/restartedAt":"'"$TIMESTAMP"'"}}}}}'

          for DEPLOY in modeling-commons-backend modeling-commons-frontend; do
            curl -sf -X PATCH \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/strategic-merge-patch+json" \
              -d "$PATCH" \
              --cacert "$CA" \
              "$APISERVER/apis/apps/v1/namespaces/modeling-commons/deployments/$DEPLOY"
          done
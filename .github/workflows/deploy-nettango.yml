name: Deploy NetTango

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - app/nettango

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '#build app/nettango')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('yarn.lock') }}-
            ${{ runner.os }}-turbo-

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: yarn run init
        env:
          HELIO_SKIP_CHECKS: 1
          HELIO_HEADLESS: 1
          NUXT_TELEMETRY_DISABLED: 1

      - name: Generate NetTango
        working-directory: apps/nettango
        env:
          NUXT_TELEMETRY_DISABLED: 1
        run: yarn run nuxt:generate

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          ssh-private-key: ${{ secrets.NETTANGO_DEPLOY_PRIVATE_KEY }}

      - name: Push to NetLogo/nettango-site
        shell: bash
        run: |
          git config --global user.name "HELIO CI"
          git config --global user.email "helio-noreply@netlogo.org"

          git clone --depth 1 git@github.com:NetLogo/nettango-site.git site
          rsync -a --delete \
            --exclude .git --exclude .nojekyll --exclude CNAME \
            apps/nettango/.output/public/ site/

          cd site
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "Deploy NetTango site from Monorepo commit \`${GITHUB_SHA::7}\`"
          git push origin HEAD

name: Weekly

# Slow checks that are too heavy for every push: the PDF manual and a smoke test of every route in each sitemap.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

env:
  HELIO_HEADLESS: "1"
  NUXT_TELEMETRY_DISABLED: "1"

permissions:
  actions: read
  contents: read

jobs:
  changes:
    name: Check for new commits since the last weekly run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Compare HEAD with the last successful weekly run
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          last=$(gh run list --repo "$REPO" --workflow weekly.yml --status success --limit 1 --json headSha --jq ".[0].headSha // empty")
          echo "Last successful weekly run: ${last:-none}, HEAD: $HEAD_SHA"
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$last" != "$HEAD_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new commits since the last successful weekly run; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

  pdf-manual:
    name: Build and test the PDF manual
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: "yarn"

      - name: Initialize Repository
        run: |
          yarn run init

      - name: Build the PDF manual
        working-directory: ./apps/docs
        env:
          PORT: "3099"
        run: yarn run docs:build-and-generate-manual

      - name: Test the PDF manual
        working-directory: ./apps/docs
        run: yarn run test:artifacts tests/artifacts/pdf.test.ts

      - name: Upload the PDF manual
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: NetLogo_User_Manual
          path: apps/docs/.build/NetLogo_User_Manual.pdf
          if-no-files-found: error

      - name: Summarize the artifact
        if: ${{ always() }}
        working-directory: ./apps/docs
        run: |
          echo "### PDF manual" >> "$GITHUB_STEP_SUMMARY"
          ls -la .build/NetLogo_User_Manual.pdf >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "PDF missing" >> "$GITHUB_STEP_SUMMARY"

  all-routes:
    name: Smoke test every route of ${{ matrix.app.name }}${{ matrix.app.shard && format(' ({0})', matrix.app.shard) || '' }}
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.app.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # docs has about 830 routes, so each shard builds the site and tests every fourth route (SMOKE_SHARD).
        app:
          - { name: docs, path: ./apps/docs, build: yarn run nuxt:generate, shard: 1/4, timeout: 45 }
          - { name: docs, path: ./apps/docs, build: yarn run nuxt:generate, shard: 2/4, timeout: 45 }
          - { name: docs, path: ./apps/docs, build: yarn run nuxt:generate, shard: 3/4, timeout: 45 }
          - { name: docs, path: ./apps/docs, build: yarn run nuxt:generate, shard: 4/4, timeout: 45 }
          - { name: learn, path: ./apps/learn, build: yarn run nuxt:build, timeout: 20 }
          - { name: nettango, path: ./apps/nettango, build: yarn run nuxt:build, timeout: 20 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: "yarn"

      - name: Initialize Repository
        run: |
          yarn run init

      - name: Build
        working-directory: ${{ matrix.app.path }}
        run: ${{ matrix.app.build }}

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Smoke test every sitemap route
        working-directory: ${{ matrix.app.path }}
        env:
          SMOKE_ALL_ROUTES: "1"
          SMOKE_SHARD: ${{ matrix.app.shard }}
        # serve-static resolves pages like the production host (nuxt preview 404s on same-named directories),
        # runs the tests once it is listening, and exits with their status.
        run: node ../../packages/vitest-config/src/serve-static.mjs .output/public 4100 -- yarn run test:e2e

  fresh-windows-install:
    # Follows the README setup on a clean Windows runner with no caches, so a broken first install shows up here.
    name: Fresh Windows install
    needs: changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Runs build, lint, check-types and test through scripts/check-repo.sh as well.
      - name: Initialize Repository
        run: yarn run init

      # learn runs the markdown autogen and content asset paths, the parts most likely to differ on Windows.
      - name: Build learn
        working-directory: ./apps/learn
        run: yarn run nuxt:build

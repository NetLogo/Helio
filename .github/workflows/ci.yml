name: Validate

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repo scripts kill node processes and prompt unless they run headless.
  HELIO_HEADLESS: "1"
  NUXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    name: Run ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [check-types, lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: "yarn"

      - name: Initialize Repository
        run: |
          sh ./scripts/initialize.sh

      - name: Run ${{ matrix.command }}
        run: yarn ${{ matrix.command }}

  test-builds:
    name: Build and test ${{ matrix.app.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - name: docs
            path: ./apps/docs
            build: yarn run nuxt:generate
            artifact-test: tests/artifacts/normal.test.ts
            e2e: true
          - name: docs (static)
            path: ./apps/docs
            build: DOCS_ENV_STATIC=1 yarn run nuxt:generate
            artifact-test: tests/artifacts/static.test.ts
            e2e: false
          - name: learn
            path: ./apps/learn
            build: yarn run nuxt:build
            e2e: true
          - name: nettango
            path: ./apps/nettango
            build: yarn run nuxt:build
            e2e: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: "yarn"

      - name: Initialize Repository
        run: |
          yarn run init

      - name: Build
        working-directory: ${{ matrix.app.path }}
        run: ${{ matrix.app.build }}

      - name: Test build output
        if: ${{ matrix.app.artifact-test }}
        working-directory: ${{ matrix.app.path }}
        run: yarn run test:artifacts ${{ matrix.app.artifact-test }}

      - name: Install Chromium
        if: ${{ matrix.app.e2e }}
        run: npx playwright-core install --with-deps chromium

      - name: Smoke test against the built site
        if: ${{ matrix.app.e2e }}
        working-directory: ${{ matrix.app.path }}
        # serve-static resolves pages like the production host (nuxt preview 404s on same-named directories),
        # runs the tests once it is listening, and exits with their status.
        run: node ../../packages/vitest-config/src/serve-static.mjs .output/public 4100 -- yarn run test:e2e

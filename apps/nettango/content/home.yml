    src: /assets/home/ants-hero.mp4
    poster: /assets/home/ants-hero.webp
  builder:
    text: Designing lessons for a new topic?
    label: Read the Builder tutorial
howItWorks:
  title: Model real world phenomena from simple blocks
  description: >-
    Each model provides blocks for a single phenomenon, such as ant foraging, gas particles, or spaceship flight.
    Students work only with the blocks that phenomenon requires, without first learning a programming language.
  example: >-
    In Antomology Introduction, students start with two blocks: one that moves the ants and one that makes them
    wander. Each later model in the sequence adds a few blocks, such as picking up food or dropping a chemical trail.
  link:
    label: Open Antomology Introduction
    to: /models/antomology-introduction
showcase:
  action: Try this one!
  cards:
    - id: antomology-pheromones
      label: >-
        The Antomology Pheromones model running: ants carry food from the flowers to the nest and leave a chemical
        trail
      text: >-
        Explore how ants use pheromones to find their way. Your students build the rule for laying a chemical trail
        and observe whether the ants mark a path back to the nest.
      video:
        src: /assets/home/antomology-pheromones.mp4
        poster: /assets/home/antomology-pheromones.webp
    - id: spaceship-programming
      label: >-
        The Spaceship Programming model running: a ship fires its engines one at a time to fly through an L-shaped
        corridor to a green target
      text: >-
        Explore how a spaceship moves when its engines fire. Your students schedule each engine with blocks and
        observe that the ship keeps moving until an opposing engine fires.
      video:
        src: /assets/home/spaceship-programming.mp4
        poster: /assets/home/spaceship-programming.webp
    - id: two-particle-sandbox
      label: "The Two Particles in a Box model running: two particles move and collide in a small box"
      text: >-
        Explore how gas particles interact in a closed box. Your students build the collision rule and observe how
        collisions change the motion of the particles.
      video:
        src: /assets/home/two-particle-sandbox.mp4
        poster: /assets/home/two-particle-sandbox.webp

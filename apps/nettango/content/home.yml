faq:
  title: Frequently asked questions
  items:
    - label: Do I need to install anything?
      answer: No. NetTango runs in your web browser. You do not need to install any software.
    - label: Do my students need to know how to code?
      answer: >-
        No. Students assemble blocks, and each model includes only the blocks its phenomenon requires. They do not
        need prior coding experience.
    - label: What does it cost?
      answer: >-
        Nothing. NetTango is free and open source, developed at Northwestern's Center for Connected Learning by the
        NetLogo Foundation.
    - label: Is there a lesson for my topic?
      answer: >-
        We are working on developing an enriched set of lessons for various topics. Right now, you can explore the
        Ideal Gas Laws lesson on CT-STEM.
      action:
        label: Explore the Ideal Gas Laws lesson
        to: https://ct-stem.northwestern.edu/curriculum/preview/513/
    - label: Which devices does it work on?
      answer: >-
        NetTango runs in a web browser. It works on Chromebooks, laptops, desktops, and tablets. Make sure your
        browser is up to date for the best experience.
    - label: Can I make blocks for a topic you don't cover?
      answer: Yes. New block sets are designed in NetTango Builder.
      action:
        label: Check out the Builder tutorial!
        to: /tutorials/introduction-to-the-nettango-builder
    - label: Do my students need accounts?
      answer: >-
        No. Students do not need accounts to use NetTango. They can start building and exploring models
        immediately.

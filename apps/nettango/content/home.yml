title: "NetTango: Block-based NetLogo models for the classroom"
cta:
  label: Find a topic you teach
  to: "#topics"
hero:
  titleLines:
    - [Your, students]
    - [build, the, model]
    - [to, learn, the, science]
  blockWord: build
  description: >-
    NetTango turns NetLogo models into blocks your students snap together. They set the rules, press GO, and watch
    the results unfold. No coding experience needed. Runs in the browser.
  netlogo:
    label: NetLogo
    to: https://www.netlogo.org
  secondary:
    label: Try a sample model of Ants Foraging

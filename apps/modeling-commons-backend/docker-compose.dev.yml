# Development services only
# Usage: docker-compose -f docker-compose.dev.yml up
# Run the app locally: npm run dev

networks:
  app_network:
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg16-bookworm
    ports:
      - 5432:5432
    env_file:
      - path: ./.env
        required: true
    environment:
      - PGDATA=/var/lib/postgresql/16/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - /tmp/com.netlogo.modeling-commons/postgresql:/var/lib/postgresql

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    command: "master -ip=seaweedfs-master -ip.bind=0.0.0.0"
    ports:
      - 9333:9333   # Master HTTP
      - 19333:19333 # Master gRPC
    volumes:
      - /tmp/com.netlogo.modeling-commons/seaweedfs/master:/data
    networks:
      - app_network

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    command: "volume -mserver=seaweedfs-master:9333 -ip.bind=0.0.0.0 -port=8080"
    ports:
      - 8080:8081   # Volume HTTP
      - 18080:18080 # Volume gRPC
    depends_on:
      - seaweedfs-master
    volumes:
      - /tmp/com.netlogo.modeling-commons/seaweedfs/volume:/data
    networks:
      - app_network

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    command: "filer -master=seaweedfs-master:9333 -ip.bind=0.0.0.0 -s3"
    ports:
      - 8888:8888   # Filer HTTP
      - 8333:8333   # S3 API
      - 18888:18888 # Filer gRPC
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    volumes:
      - /tmp/com.netlogo.modeling-commons/seaweedfs/filer:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - app_network

  redis:
    image: redis:8-alpine
    profiles:
      - cache
      - optional
    ports:
      - ${REDIS_PORT:-6379}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - /tmp/com.netlogo.modeling-commons/redis/data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - 1025:1025 # SMTP
      - 8025:8025 # Web UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - /tmp/com.netlogo.modeling-commons/mailpit:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    networks:
      - app_network

  # galapagos:
  #   profiles:
  #     - frontend
  #     - optional
  #   build:
  #     context: .
  #     dockerfile: ./docker/galapagos/Dockerfile
  #   container_name: galapagos
  #   ports:
  #     - "9010:8080"
  #   volumes:
  #     - /tmp/com.netlogo.modeling-commons/galapagos:/opt/galapagos
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  netlogo-services:
    image: ghcr.io/netlogo/netlogo-services:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - 51090:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ALLOWED_ORIGINS: localhost,host.docker.internal,*.svc.cluster,netlogo.org,*.netlogo.org,modelingcommons.org,*.modelingcommons.org,modelingcommons.com,*.modelingcommons.com,netlogoweb.org,*.netlogoweb.org,ccl.northwestern.edu
      LOCALHOST: host.docker.internal
      TRANSLATE_LOCALHOST: "true"
    profiles:
      - lambda
      - optional
    networks:
      - app_network

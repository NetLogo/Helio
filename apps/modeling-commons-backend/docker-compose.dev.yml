# Development services only
# Usage: docker-compose -f docker-compose.dev.yml up
# Run the app locally: npm run dev

networks:
  app_network:
    driver: bridge

services:
  postgres:
    image: postgres:18
    ports:
      - 5432:5432
    env_file:
      - path: ./.env
        required: true
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - /tmp/com.netlogo.modeling-commons/postgresql:/var/lib/postgresql

  rustfs:
    image: rustfs/rustfs:latest
    command: /data
    ports:
      - 41090:41090 # API
      - 41091:41091 # Console
    environment:
      RUSTFS_ADDRESS: :41090
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: :41091
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBS_LOGGER_LEVEL: info
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://localhost:41090/health && curl -f
            http://localhost:9001/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - /tmp/modeling-commons-rustfs-data:/data
      - /tmp/com.netlogo.modeling-commons/rustfs/logs:/logs
    networks:
      - app_network

  redis:
    image: redis:8-alpine
    profiles:
      - cache
      - optional
    ports:
      - ${REDIS_PORT:-6379}:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - /tmp/com.netlogo.modeling-commons/redis/data:/data

  # galapagos:
  #   profiles:
  #     - frontend
  #     - optional
  #   build:
  #     context: .
  #     dockerfile: ./docker/galapagos/Dockerfile
  #   container_name: galapagos
  #   ports:
  #     - "9010:8080"
  #   volumes:
  #     - /tmp/com.netlogo.modeling-commons/galapagos:/opt/galapagos
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  netlogo-services:
    image: ghcr.io/netlogo/netlogo-services:latest
    platform: linux/amd64
    ports:
      - 51090:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ALLOWED_ORIGINS: localhost,host.docker.internal,*.svc.cluster,netlogo.org,*.netlogo.org,modelingcommons.org,*.modelingcommons.org,modelingcommons.com,*.modelingcommons.com,netlogoweb.org,*.netlogoweb.org,ccl.northwestern.edu
      LOCALHOST: host.docker.internal
      TRANSLATE_LOCALHOST: "true"
    profiles:
      - lambda
      - optional
    networks:
      - app_network

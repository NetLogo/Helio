ist\n    Given an authenticated user \"owner\"\n    And a public model \"Team Model\" created by \"owner\"\n    And an authenticated user \"contributor\"\n    And \"owner\" has added \"contributor\" as a contributor to \"Team Model\"\n    When I list authors of the model \"Team Model\"\n    Then the response status should be 200\n\n  Scenario: Remove a contributor from a model\n    Given an authenticated user \"owner\"\n    And a public model \"Shrinking Team\" created by \"owner\"\n    And an authenticated user \"contributor\"\n    And \"owner\" has added \"contributor\" as a contributor to \"Shrinking Team\"\n    When \"owner\" removes \"contributor\" from \"Shrinking Team\"\n    Then the response status should be 204\n\n  Scenario: Cannot remove the owner\n    Given an authenticated user \"owner\"\n    And a public model \"Owner Model\" created by \"owner\"\n    When \"owner\" removes \"owner\" from \"Owner Model\"\n    Then the response status should be 403\n\n  Scenario: Transfer ownership to a contributor\n    Given an authenticated user \"owner\"\n    And a public model \"Transfer Model\" created by \"owner\"\n    And an authenticated user \"new-owner\"\n    And \"owner\" has added \"new-owner\" as a contributor to \"Transfer Model\"\n    When \"owner\" transfers ownership of \"Transfer Model\" to \"new-owner\"\n    Then the response status should be 204\n\n  Scenario: Cannot transfer ownership to a non-author\n    Given an authenticated user \"owner\"\n    And a public model \"No Transfer\" created by \"owner\"\n    And an authenticated user \"outsider\"\n    When \"owner\" transfers ownership of \"No Transfer\" to \"outsider\"\n    Then the response status should be 404\n\n  Scenario: Non-owner cannot add contributors\n    Given an authenticated user \"owner\"\n    And a public model \"Restricted Model\" created by \"owner\"\n    And an authenticated user \"contributor\"\n    And \"owner\" has added \"contributor\" as a contributor to \"Restricted Model\"\n    And an authenticated user \"intruder\"\n    When \"contributor\" adds \"intruder\" as a contributor to \"Restricted Model\"\n    Then the response status should be 403\n\n  Scenario: List models by user\n    Given an authenticated user \"author\"\n    And a public model \"Author's Model\" created by \"author\"\n    When I list models by user \"author\"\n    Then the response status should be 200\n    And the response body should have property \"data\" as an array\n    And the response body property \"data\" should have length 1\n\n  Scenario: Cannot add the same contributor twice\n    Given an authenticated user \"owner\"\n    And a public model \"Dup Model\" created by \"owner\"\n    And an authenticated user \"contributor\"\n    And \"owner\" has added \"contributor\" as a contributor to \"Dup Model\"\n    When \"owner\" adds \"contributor\" as a contributor to \"Dup Model\"\n    Then the response status should be 409\n","uri":"tests/api/model-author.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Model Authors","description":"  As a model owner\n  I want to manage contributors and ownership\n  So that I can collaborate on models with other users","children":[{"scenario":{"id":"b42e8d03-933b-4915-863b-59ea9b2efb26","tags":[],"location":{"line":6,"column":3},"keyword":"Scenario","name":"List authors of a model","description":"","steps":[{"id":"c26bde05-e692-4c6e-87ec-6044a042b9d3","location":{"line":7,"column":5},"keyword":"Given ","keywordType":"Context","text":"an authenticated user"},{"id":"be4d8021-d9ed-4149-af25-07ca634b7b5a","location":{"line":8,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"a public model \"Authored Model\" created by the current user"},{"id":"09f520fd-b591-44ba-832e-93951954da70","location":{"line":9,"column":5},"keyword":"When ","keywordType":"Action","text":"I list authors of the model \"Author  authenticated user \"reader\"\n    When \"owner\" grants \"read\" permission on \"Shared Model\" to \"reader\"\n    Then the response status should be 201\n\n  Scenario: User with read permission can access a private model\n    Given an authenticated user \"owner\"\n    And a private model \"Readable Model\" created by \"owner\"\n    And an authenticated user \"reader\"\n    And \"owner\" has granted \"read\" permission on \"Readable Model\" to \"reader\"\n    When \"reader\" gets the model \"Readable Model\"\n    Then the response status should be 200\n\n  Scenario: User with write permission can update a model\n    Given an authenticated user \"owner\"\n    And a public model \"Writable Model\" created by \"owner\"\n    And an authenticated user \"writer\"\n    And \"owner\" has granted \"write\" permission on \"Writable Model\" to \"writer\"\n    When \"writer\" updates the model \"Writable Model\" with visibility \"private\"\n    Then the response status should be 204\n\n  Scenario: User with read permission cannot update a model\n    Given an authenticated user \"owner\"\n    And a public model \"Read Only Model\" created by \"owner\"\n    And an authenticated user \"reader\"\n    And \"owner\" has granted \"read\" permission on \"Read Only Model\" to \"reader\"\n    When \"reader\" updates the model \"Read Only Model\" with visibility \"private\"\n    Then the response status should be 403\n\n  Scenario: List permissions on a model\n    Given an authenticated user \"owner\"\n    And a private model \"Listed Model\" created by \"owner\"\n    And an authenticated user \"collaborator\"\n    And \"owner\" has granted \"write\" permission on \"Listed Model\" to \"collaborator\"\n    When \"owner\" lists permissions on \"Listed Model\"\n    Then the response status should be 200\n    And the response body should be an array\n\n  Scenario: Revoke permission\n    Given an authenticated user \"owner\"\n    And a private model \"Revoke Model\" created by \"owner\"\n    And an authenticated user \"former\"\n    And \"owner\" has granted \"read\" permission on \"Revoke Model\" to \"former\"\n    When \"owner\" revokes permission on \"Revoke Model\" from \"former\"\n    Then the response status should be 204\n\n  Scenario: Revoked user can no longer access a private model\n    Given an authenticated user \"owner\"\n    And a private model \"Locked Out Model\" created by \"owner\"\n    And an authenticated user \"former\"\n    And \"owner\" has granted \"read\" permission on \"Locked Out Model\" to \"former\"\n    And \"owner\" has revoked permission on \"Locked Out Model\" from \"former\"\n    When \"former\" gets the model \"Locked Out Model\"\n    Then the response status should be 403\n\n  Scenario: Non-admin cannot grant permissions\n    Given an authenticated user \"owner\"\n    And a public model \"Locked Model\" created by \"owner\"\n    And an authenticated user \"intruder\"\n    When \"intruder\" grants \"write\" permission on \"Locked Model\" to \"intruder\"\n    Then the response status should be 403\n\n  Scenario: Cannot grant duplicate permission\n    Given an authenticated user \"owner\"\n    And a private model \"Dup Perm Model\" created by \"owner\"\n    And an authenticated user \"grantee\"\n    And \"owner\" has granted \"read\" permission on \"Dup Perm Model\" to \"grantee\"\n    When \"owner\" grants \"read\" permission on \"Dup Perm Model\" to \"grantee\"\n    Then the response status should be 409\n\n  Scenario: Grant admin permission allows managing permissions\n    Given an authenticated user \"owner\"\n    And a private model \"Delegated Model\" created by \"owner\"\n    And an authenticated user \"delegate\"\n    And \"owner\" has granted \"admin\" permission on \"Delegated Model\" to \"delegate\"\n    And an authenticated user \"third\"\n    When \"delegate\" grants \"read\" permission on \"Delegated Model\" to \"third\"\n    Then the response status should be 201\n","uri":"tests/api/model-permission.featu l \"Delegated Model\" created by \"owner\"","type":"Context","astNodeIds":["81e178b6-a39c-4888-9119-7a9e25ef97e4"]},{"id":"1ccb6cee-3ff2-4512-b69b-9e3bba8f7f4b","text":"an authenticated user \"delegate\"","type":"Context","astNodeIds":["1d763eba-c32c-495d-8d62-ebd732be9fc7"]},{"id":"1e89695d-d0f8-4d90-a75e-8b61127feffb","text":"\"owner\" has granted \"admin\" permission on \"Delegated Model\" to \"delegate\"","type":"Context","astNodeIds":["748b2afd-f20f-4fa2-ba4a-16669ad8282e"]},{"id":"eba7dca2-08eb-482f-ac89-dfb8f336c20e","text":"an authenticated user \"third\"","type":"Context","astNodeIds":["292132f4-74e3-4587-a76f-7700e54767a0"]},{"id":"5f6e7603-3dba-4937-a0b9-fae1e3f9a81d","text":"\"delegate\" grants \"read\" permission on \"Delegated Model\" to \"third\"","type":"Action","astNodeIds":["54befcbd-9934-48ac-bf3f-86e1864f05c2"]},{"id":"22b5d082-e74f-42f3-a299-d96590184282","text":"the response status should be 201","type":"Outcome","astNodeIds":["9ca52564-3642-493d-9580-4ec131917110"]}]}},{"source":{"data":"Feature: Model Version Tags\n  As a model author\n  I want to tag model versions\n  So that models are discoverable by topic\n\n  Scenario: Add a tag to a model's current version\n    Given an authenticated user\n    And a public model \"Tagged Model\" created by the current user\n    And a version \"v1\" for \"Tagged Model\" with title \"Initial\"\n    When I add tag \"ecology\" to model \"Tagged Model\"\n    Then the response status should be 201\n    And the response body should have property \"tagId\"\n    And the response body property \"tagName\" should equal \"ecology\"\n\n  Scenario: Add multiple tags to a model\n    Given an authenticated user\n    And a public model \"Multi Tag Model\" created by the current user\n    And a version \"v1\" for \"Multi Tag Model\" with title \"Initial\"\n    When I add tag \"simulation\" to model \"Multi Tag Model\"\n    Then the response status should be 201\n    When I add tag \"netlogo\" to model \"Multi Tag Model\"\n    Then the response status should be 201\n\n  Scenario: Cannot add the same tag twice\n    Given an authenticated user\n    And a public model \"Dup Tag Model\" created by the current user\n    And a version \"v1\" for \"Dup Tag Model\" with title \"Initial\"\n    And tag \"duplicate\" has been added to model \"Dup Tag Model\"\n    When I add tag \"duplicate\" to model \"Dup Tag Model\"\n    Then the response status should be 409\n\n  Scenario: Remove a tag from a model\n    Given an authenticated user\n    And a public model \"Untagged Model\" created by the current user\n    And a version \"v1\" for \"Untagged Model\" with title \"Initial\"\n    And tag \"removable\" has been added to model \"Untagged Model\"\n    When I remove tag \"removable\" from model \"Untagged Model\"\n    Then the response status should be 204\n\n  Scenario: List tags for a specific version\n    Given an authenticated user\n    And a public model \"Version Tags\" created by the current user\n    And a version \"v1\" for \"Version Tags\" with title \"First\"\n    And tag \"biology\" has been added to model \"Version Tags\"\n    When I list tags for version 1 of model \"Version Tags\"\n    Then the response status should be 200\n    And the response body should be an array\n\n  Scenario: Tagging requires write permission\n    Given an authenticated user \"owner\"\n    And a private model \"Protected Model\" created by \"owner\"\n    And a version \"v1\" for \"Protected Model\" with title \"Secret\"\n    And an authenticated user \"stranger\"\n    When \"stranger\" adds tag \"hacked\" to model \"Protected Model\"\n    Then the response status should be 403\n\n  Scenario: Adding a tag creates the tag if it does not exist\n    Given an authenticated user\n    And a public model \"New Tag Model\" created by the current user\n    And a version \"v1\" for \"New Tag Model\" with title \"Initial\"\n    When I add tag \"brand-new-tag\" to model \"New Tag Model\"\n    Then the response status should be 201\n    When I send a GET request to \"/api/v1/tags?q=brand-new\"\n    Then the response status should be 200\n","uri":"tests/api/model-version-tag.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Model Version Tags","description":"  As a model author\n  I want to tag model versions\n  So that models are discoverable by topic","children":[{"scenario":{"id":"3d07d23e-3ea0-4524-af8c-e77d891f145a","tags":[],"location":{"line":6,"column":3},"keyword":"Scenario","name":"Add a tag to a model's current version","description":"","steps":[{"id":"c90002af-75d2-4a0b-9683-6c9452be395a","location":{"line":7,"column":5},"keyword":"Given ","keywordType":"Context","text":"an authenticated user"},{"id":"9ee07868-703c-4556-8d04-798766d6f7cd","location":{"line":8,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"a public model \"Tagged Model\" created by the current user"},{"id":"fab1ed14-d115-41f8-8aea-cfa771f35ae4","location":{"line":9,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"a version \"v1\" for \"Tagged Model\" with title \"Initial\""},{"id":"88d6e858-a7d1-4ed6-9415-bc1257c9fa82","location":{"line":10,"column":5},"keyword":"When ","keywordType":"Action","text":"I add tag \"ecology\" to model \"Tagged Model\""},{"id":"9fc6efdd-f4a9-4a4a-acff-594a38298108","location":{"line":11,"column":5},"keyword":"Then ","keywordType":"Outcome","text":"the response status should be 201"},{"id":"283575de-77c6-4c80-b735-8ca6f771f9f1","location":{"line":12,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"the response body should have property \"tagId\""},{"id":"df64a2ef-7e50-407c-8a63-5f4ec0952cc8","location":{"line":13,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"the response body property \"tagName\" should equal \"ecology\""}],"examples":[]}},{"scenario":{"id":"8f2924a0-b83c-4a58-98a1-17cd7f2de hould be 200","type":"Outcome","astNodeIds":["b5e959ee-0c71-44fc-80c0-ec35334dde50"]}]}},{"source":{"data":"Feature: Model Versions\n  As a model author\n  I want to manage model versions\n  So that I can track changes to my models over time\n\n  Scenario: Create a version for a model\n    Given an authenticated user\n    And a public model \"My Model\" created by the current user\n    When I create a version for \"My Model\" with title \"Initial Version\"\n    Then the response status should be 201\n    And the response body should have property \"id\"\n\n  @pending\n  Scenario: Create a second version finalizes the first\n    Given an authenticated user\n    And a public model \"Evolving Model\" created by the current user\n    And a version \"v1\" for \"Evolving Model\" with title \"First Draft\"\n    When I create a version for \"Evolving Model\" with title \"Second Draft\"\n    Then the response status should be 201\n\n  Scenario: List versions of a model with one version\n    Given an authenticated user\n    And a public model \"Versioned Model\" created by the current user\n    And a version \"v1\" for \"Versioned Model\" with title \"Release 1\"\n    When I list versions of the model \"Versioned Model\"\n    Then the response status should be 200\n    And the response body should have property \"data\" as an array\n    And the response body property \"data\" should have length 1\n\n  @pending\n  Scenario: List versions returns multiple versions in order\n    Given an authenticated user\n    And a public model \"Multi Version\" created by the current user\n    And a version \"v1\" for \"Multi Version\" with title \"Alpha\"\n    And a version \"v2\" for \"Multi Version\" with title \"Beta\"\n    When I list versions of the model \"Multi Version\"\n    Then the response status should be 200\n    And the response body property \"data\" should have length 2\n\n  Scenario: Get a specific version by number\n    Given an authenticated user\n    And a public model \"Specific Model\" created by the current user\n    And a version \"v1\" for \"Specific Model\" with title \"The Version\"\n    When I get version 1 of the model \"Specific Model\"\n    Then the response status should be 200\n    And the response body property \"title\" should equal \"The Version\"\n\n  Scenario: Update the current version title\n    Given an authenticated user\n    And a public model \"Editable Model\" created by the current user\n    And a version \"v1\" for \"Editable Model\" with title \"Old Title\"\n    When I update the current version of \"Editable Model\" with title \"New Title\"\n    Then the response status should be 204\n\n  Scenario: Update the current version description\n    Given an authenticated user\n    And a public model \"Described Model\" created by the current user\n    And a version \"v1\" for \"Described Model\" with title \"Some Title\"\n    When I update the current version of \"Described Model\" with description \"A detailed description\"\n    Then the response status should be 204\n\n  Scenario: Creating a version requires write permission\n    Given an authenticated user \"owner\"\n    And a private model \"Locked Model\" created by \"owner\"\n    And an authenticated user \"stranger\"\n    When \"stranger\" creates a version for \"Locked Model\" with title \"Nope\"\n    Then the response status should be 403\n\n  Scenario: Listing versions requires read access\n    Given an authenticated user \"owner\"\n    And a private model \"Private Model\" created by \"owner\"\n    And an authenticated user \"stranger\"\n    When \"stranger\" lists versions of the model \"Private Model\"\n    Then the response status should be 403\n\n  Scenario: Updating a version requires write access\n    Given an authenticated user \"owner\"\n    And a public model \"Guarded Model\" created by \"owner\"\n    And a version \"v1\" for \"Guarded Model\" with title \"Original\"\n    And an authenticated user \"stranger\"\n    When \"stranger\" updates the current version of \"Guarded Model\" with title \"Hacked\"\n    Then the response status should be 403\n\n  Scenario: List versions of a model with no versions returns empty\n    Given an authenticated user\n    And a public model \"Empty Model\" created by the current user\n    When I list versions of the model \"Empty Model\"\n    Then the response status should be 200\n    And the response body should have property \"data\" as an array\n    And the response body property \"data\" should have length 0\n","uri":"tests/api/model-version.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Model Versions","description":"  As a model author\n  I want to manage model versions\n  So that I can track changes to my models over time","children":[{"scenario":{"id":"b2181b1b-ad92-4aed-99ba-8083ec3d3eae","tags":[],"location":{"line":6,"column":3},"keyword":"Scenario","name":"Create a version for a model","description":"","steps":[{"id":"664aaa6e-e5ab-45eb-a507-8782d41bc17a","location":{"line":7,"column":5},"keyword":"Given ","keywordType":"Context","text":"an authenticated user"},{"id":"b2f01b08-0a55-4715-bd27-473fc1999ddc","location":{"line":8,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"a public model \"My Model\" created by the current user"},{"id":"80d497b6-ec37-497b-9fe1-3ccaef834d5d","location":{"line":9,"column":5},"keyword":"When ","keywordType":"Action","text":"I create a version for \"My Model\" with title \"Initial Version\""},{"id":"323ed6f9-f1cb-47ad-bb98-efb38928f275","location":{"line":10,"column":5},"keyword":"Then ","keywordType":"Outcome","text":"the response status should be 201"},{"id":"50407e8c-90f5-41bc-a088-0201b2debb3d","location":{"line":11,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"the response body should have property \"id\""}],"examples":[]}},{"scenario":{"id":"e8d56c3c-824d-40b8-bea c model \"My Model\" created by the current user\n    When I update the model \"My Model\" with visibility \"private\"\n    Then the response status should be 204\n\n  Scenario: Delete a model\n    Given an authenticated user\n    And a public model \"To Delete\" created by the current user\n    When I delete the model \"To Delete\"\n    Then the response status should be 204\n\n  Scenario: Cannot access a private model without permission\n    Given an authenticated user \"owner\"\n    And a private model \"Secret Model\" created by \"owner\"\n    And an authenticated user \"stranger\"\n    When \"stranger\" gets the model \"Secret Model\"\n    Then the response status should be 403\n\n  Scenario: Search models by keyword\n    Given an authenticated user\n    And a public model \"Climate Change Sim\" created by the current user\n    When I send a GET request to \"/api/v1/models?keyword=Climate\"\n    Then the response status should be 200\n    And the response body should have property \"data\" as an array\n\n  Scenario: Create a forked model\n    Given an authenticated user\n    And a public model \"Original\" created by the current user\n    When I fork the model \"Original\" with title \"My Fork\"\n    Then the response status should be 201\n    And the response body should have property \"id\"\n\n  Scenario: Unlisted models do not appear in search results\n    Given an authenticated user \"owner\"\n    And an unlisted model \"Hidden Gem\" created by \"owner\"\n    When \"owner\" sends a GET request to \"/api/v1/models\"\n    Then the response status should be 200\n    And the response body property \"data\" should have length 0\n\n  Scenario: Private models do not appear in search for non-owners\n    Given an authenticated user \"owner\"\n    And a private model \"Secret Stuff\" created by \"owner\"\n    And an authenticated user \"stranger\"\n    When \"stranger\" sends a GET request to \"/api/v1/models\"\n    Then the response status should be 200\n    And the response body property \"data\" should have length 0\n\n  Scenario: Private models appear in search for the owner\n    Given an authenticated user \"owner\"\n    And a private model \"My Secret\" created by \"owner\"\n    When \"owner\" sends a GET request to \"/api/v1/models\"\n    Then the response status should be 200\n    And the response body property \"data\" should have length 1\n","uri":"tests/api/model.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Model Management","description":"  As a user\n  I want to manage models\n  So that I can create, view, update, and delete models","children":[{"scenario":{"id":"6081b920-5107-45d9-851b-020225dd53ad","tags":[],"location":{"line":6,"column":3},"keyword":"Scenario","name":"Create a model","description":"","steps":[{"id":"9b099d7b-5ac5-4dca-9a66-1d0c01cd2b33","location":{"line":7,"column":5},"keyword":"Given ","keywordType":"Context","text":"an authenticated user"},{"id":"a4fc0f4f-40f4-475c-87db-8affca4d95ba","location":{"line":8,"column":5},"keyword":"When ","keywordType":"Action","text":"I create a model with title \"Wolf Sheep Predation\""},{"id":"ba68132b-0223-4248-afeb-eeb393066451","location":{"line":9,"column":5},"keyword":"Then ","keywordType":"Outcome","text":"the response status should be 201"},{"id":"8c1470ab-1135-4d27-a4cb-c3e5ce3a9927","location":{"line":10,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"the response body should have property \"id\""}],"examples":[]}},{"scenario":{"id":"12517147-71f3-40eb-850e-a4df06e51499","tags":[],"location":{"line":12,"column":3},"keyword":"Scenario","name":"Create a model requires authentication","description":"","steps":[{"id":"62601fea-9176-4ceb-9b4b-c165ba2b1e7a","location":{"line":13,"column":5},"keyword":"When ","keywordType":"Action","text":"I send a POST request to \"/api/v1/models\" with JSON body:","docString":{"loc Feature: User Management\n  As a user\n  I want to manage user profiles\n  So that I can view and update user information\n\n  Scenario: List users returns paginated results\n    Given an authenticated user\n    When I send a GET request to \"/api/v1/users\"\n    Then the response status should be 200\n    And the response body should have property \"data\" as an array\n    And the response body should have property \"count\"\n\n  Scenario: Get user by ID\n    Given an authenticated user\n    When I get the current user's profile\n    Then the response status should be 200\n    And the response body should have property \"id\"\n    And the response body should have property \"email\"\n\n  Scenario: Update own profile\n    Given an authenticated user\n    When I update the current user with userKind \"student\"\n    Then the response status should be 204\n\n  Scenario: Update profile requires authentication\n    When I send a PATCH request to \"/api/v1/users/00000000-0000-0000-0000-000000000000\" with body:\n      | userKind | student |\n    Then the response status should be 401\n\n  Scenario: Delete own account\n    Given an authenticated user\n    When I delete the current user's account\n    Then the response status should be 204\n\n  Scenario: Cannot update another user's profile\n    Given an authenticated user \"alice\"\n    And an authenticated user \"bob\"\n    When \"alice\" updates \"bob\" with userKind \"teacher\"\n    Then the response status should be 403\n\n  Scenario: Private profile returns only public fields to other users\n    Given an authenticated user \"alice\"\n    And \"alice\" sets their profile to private\n    And an authenticated user \"bob\"\n    When \"bob\" gets the profile of \"alice\"\n    Then the response status should be 200\n    And the response body should have property \"name\"\n    And the response body should have property \"isProfilePublic\" equal to false\n    And the response body should not have property \"email\"\n    And the response body should not have property \"image\"\n    And the response body should not have property \"systemRole\"\n    And the response body should not have property \"userKind\"\n\n  Scenario: Private profile returns full fields to the owner\n    Given an authenticated user \"alice\"\n    And \"alice\" sets their profile to private\n    When I get the current user's profile\n    Then the response status should be 200\n    And the response body should have property \"email\"\n    And the response body should have property \"isProfilePublic\" equal to false\n\n  Scenario: Public profile returns full fields to other users\n    Given an authenticated user \"alice\"\n    And \"alice\" sets their profile to public\n    And an authenticated user \"bob\"\n    When \"bob\" gets the profile of \"alice\"\n    Then the response status should be 200\n    And the response body should have property \"email\"\n    And the response body should have property \"isProfilePublic\" equal to true\n","uri":"tests/api/user.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"User Management","description":"  As a user\n  I want to manage user profiles\n  So that I can view and update user information","children":[{"scenario":{"id":"453441ba-b7c4-4475-92d6-5c73c56f2ba1","tags":[],"location":{"line":6,"column":3},"keyword":"Scenario","name":"List users returns paginated results","description":"","steps":[{"id":"a6940d9f-3188-4eb1-8aa0-4c95ef4def92","location":{"line":7,"column":5},"keyword":"Given ","keywordType":"Context","text":"an authenticated user"},{"id":"fc0703c3-e0da-45a9-8f07-1d457ee494a6","location":{"line":8,"column":5},"keyword":"When ","keywordType":"Action","text":"I send a GET request to \"/api/v1/users\""},{"id":"00a39d9d-c7bb-4dd3-9972-3dd1929fad62","location":{"line":9,"column":5},"keyword":"Then ","keywordType":"Outcome","text":"the response status
